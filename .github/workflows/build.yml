name: Build 67 Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 67-client-github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: chmod +x gradlew && ./gradlew --no-daemon jar
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: 67-client
          path: 67-client-github/build/libs/67-client-1.0.0.jar
          if-no-files-found: error
